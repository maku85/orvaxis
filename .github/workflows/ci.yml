name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Check, type-check, test & build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.13.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm check

      - name: Type-check
        run: pnpm tsc --noEmit

      - name: Type-check API examples
        run: pnpm typecheck:tests

      - name: Check multi-tenant demo policies and permission matrix
        run: pnpm check:tenant-demo

      - name: Compare route protections with the committed baseline
        run: pnpm check:protection

      - name: Upload route protection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-protection-report
          path: protection-report/
          if-no-files-found: ignore

      - name: Test
        run: pnpm test:coverage

      - name: Build package
        run: pnpm build

      - name: Verify package imports and declarations without optional peers
        run: pnpm check:package
